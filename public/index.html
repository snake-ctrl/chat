<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #0088cc;
    --primary-dark: #006699;
    --primary-light: #e6f4fa;
    --bg: #f0f2f5;
    --sidebar-bg: #ffffff;
    --chat-bg: #efeae2;
    --border: #e4e7eb;
    --text: #111b21;
    --text-light: #667781;
    --text-lighter: #8696a0;
    --bubble-me: #d9fdd3;
    --bubble-other: #ffffff;
    --shadow-sm: 0 1px 2px rgba(11,20,26,0.08);
    --shadow-md: 0 2px 8px rgba(11,20,26,0.12);
    --shadow-lg: 0 8px 32px rgba(11,20,26,0.16);
  }
  body.dark {
    --primary: #00a884;
    --primary-dark: #008f72;
    --primary-light: #103529;
    --bg: #0b141a;
    --sidebar-bg: #111b21;
    --chat-bg: #0b141a;
    --border: #222d34;
    --text: #e9edef;
    --text-light: #8696a0;
    --text-lighter: #667781;
    --bubble-me: #005c4b;
    --bubble-other: #202c33;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: var(--text);
  }

  /* ========== 登录页 ========== */
  .login-box {
    background: var(--sidebar-bg);
    padding: 48px 40px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .login-box .logo {
    text-align: center;
    font-size: 48px;
    margin-bottom: 12px;
  }
  .login-box h2 {
    text-align: center;
    color: var(--text);
    margin-bottom: 6px;
    font-size: 24px;
    font-weight: 600;
  }
  .login-box .subtitle {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .login-box input,
  .login-box select {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    background: var(--sidebar-bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .login-box input:focus,
  .login-box select:focus {
    border-color: var(--primary);
  }
  .login-box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s;
  }
  .login-box button:hover { background: var(--primary-dark); }
  .login-box button.secondary {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .login-box button.secondary:hover {
    background: var(--primary-light);
  }
  .login-box .msg {
    color: #ef4444;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }

  /* ========== 聊天主界面 ========== */
  .chat {
    width: 100%;
    max-width: 1200px;
    height: 100vh;
    background: var(--sidebar-bg);
    display: none;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .chat {
      height: 92vh;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
    }
  }
  .chat-inner { display: flex; height: 100%; }

  /* ========== 左侧栏 ========== */
  .sidebar {
    width: 340px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar .me {
    padding: 14px 16px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sidebar .me .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sidebar .me .info {
    flex: 1;
    min-width: 0;
  }
  .sidebar .me .name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar .me .status {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .sidebar .me .icon-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .sidebar .me .icon-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  .sidebar .search-box {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar .search-box input {
    width: 100%;
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }

  .sidebar .section {
    padding: 12px 16px 6px;
    font-size: 12px;
    color: var(--text-light);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar .list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  .sidebar .item {
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text);
    transition: background 0.15s;
    position: relative;
  }
  .sidebar .item:hover { background: var(--bg); }
  .sidebar .item.active {
    background: var(--primary);
    color: #fff;
  }
  .sidebar .item .item-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sidebar .item .item-info {
    flex: 1;
    min-width: 0;
  }
  .sidebar .item .item-name {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar .item .item-status {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sidebar .item.active .item-status { color: rgba(255,255,255,0.8); }
  .sidebar .item .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00a884;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sidebar .item .badge {
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }
  .sidebar .item.active .badge {
    background: #fff;
    color: var(--primary);
  }

  /* ========== 右侧聊天区 ========== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--chat-bg);
    position: relative;
  }
  .main .header {
    padding: 12px 20px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .main .header .back-btn {
    display: none;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    border-radius: 50%;
  }
  .main .header .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
  }
  .main .header .header-info {
    flex: 1;
    min-width: 0;
  }
  .main .header .header-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .main .header .header-status {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .main .header .icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .main .header .icon-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* 聊天背景纹理 */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 6% 20px 6%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,136,204,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(139,92,246,0.04) 0%, transparent 50%);
  }

  /* 日期分隔 */
  .date-divider {
    align-self: center;
    background: var(--sidebar-bg);
    color: var(--text-light);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    margin: 8px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* 消息行 */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 70%;
    align-self: flex-start;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.me {
    align-self: flex-end;
  }

  .msg .bubble {
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--bubble-other);
    font-size: 14.5px;
    line-height: 1.45;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
    color: var(--text);
    position: relative;
    border-top-left-radius: 4px;
  }
  .msg.me .bubble {
    background: var(--bubble-me);
    border-top-left-radius: 12px;
    border-top-right-radius: 4px;
    color: var(--text);
  }
  body.dark .msg.me .bubble { color: #e9edef; }

  .msg .bubble img {
    max-width: 240px;
    max-height: 240px;
    border-radius: 8px;
    display: block;
    margin: -2px 0;
    cursor: pointer;
  }
  .msg .bubble .revoked {
    color: var(--text-lighter);
    font-style: italic;
    font-size: 13px;
  }

  /* 时间戳 */
  .msg .time {
    font-size: 11px;
    color: var(--text-lighter);
    margin-top: 3px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .msg.me .time {
    justify-content: flex-end;
  }
  .msg .time .sender {
    font-weight: 600;
    color: var(--primary);
  }
  .msg.me .time .sender { color: var(--primary); }
  .msg .time .check {
    color: var(--primary);
    font-size: 12px;
  }

  /* 撤回按钮 */
  .msg .revoke-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-lighter);
    font-size: 11px;
    cursor: pointer;
    padding: 0 4px;
  }
  .msg:hover .revoke-btn { display: inline; }
  .msg .revoke-btn:hover { color: #ef4444; }

  /* 私聊消息 */
  .msg.private .bubble {
    background: #fff8e1;
    border: 1px solid #ffe082;
  }
  body.dark .msg.private .bubble {
    background: #2a2410;
    border-color: #4a3f10;
  }
  .msg.me.private .bubble {
    background: #fff3c4;
    border: 1px solid #ffd54f;
  }
  body.dark .msg.me.private .bubble {
    background: #3a3010;
    border-color: #5a4a10;
  }

  /* 系统消息 */
  .msg.system {
    align-self: center;
    max-width: 80%;
  }
  .msg.system .bubble {
    background: var(--sidebar-bg);
    color: var(--text-light);
    font-size: 12px;
    box-shadow: var(--shadow-sm);
    border-radius: 8px;
    padding: 4px 12px;
    text-align: center;
  }

  /* ========== 输入区 ========== */
  .input-area {
    padding: 10px 16px;
    background: var(--sidebar-bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  .input-area .icon-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-light);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .input-area .icon-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
  }
  .input-area .input-wrap {
    flex: 1;
    background: var(--bg);
    border-radius: 20px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
  }
  .input-area input[type="text"] {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    padding: 4px 0;
  }
  .input-area .send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .input-area .send-btn:hover { background: var(--primary-dark); }

  /* ========== 表情面板 ========== */
  .emoji-panel {
    position: absolute;
    bottom: 72px;
    left: 16px;
    background: var(--sidebar-bg);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    padding: 12px;
    display: none;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    z-index: 10;
    max-height: 280px;
    overflow-y: auto;
    border: 1px solid var(--border);
  }
  .emoji-panel.show { display: grid; }
  .emoji-panel span {
    font-size: 22px;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    text-align: center;
    transition: transform 0.1s;
  }
  .emoji-panel span:hover {
    background: var(--bg);
    transform: scale(1.15);
  }

  /* ========== 图片预览 ========== */
  .image-preview {
    position: absolute;
    bottom: 72px;
    left: 16px;
    background: var(--sidebar-bg);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    padding: 10px;
    display: none;
    z-index: 10;
    border: 1px solid var(--border);
  }
  .image-preview.show { display: block; }
  .image-preview img {
    max-width: 180px;
    max-height: 180px;
    border-radius: 8px;
    display: block;
  }
  .image-preview button {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: #ef4444;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }

  /* ========== 滚动条 ========== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(134,150,160,0.3);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(134,150,160,0.5); }

  /* ========== 响应式 ========== */
  @media (max-width: 768px) {
    body { padding: 0; }
    .chat {
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
    }
    .sidebar {
      width: 100%;
      border-right: none;
    }
    .main {
      display: none;
      width: 100%;
    }
    .chat.mobile-chat .sidebar { display: none; }
    .chat.mobile-chat .main { display: flex; }
    .main .header .back-btn { display: flex; }
    .messages { padding: 12px 12px; }
    .msg { max-width: 85%; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-box" id="loginBox">
  <div class="logo">💬</div>
  <h2>聊天室</h2>
  <div class="subtitle">注册或登录开始聊天</div>
  <div class="msg" id="loginMsg"></div>
  <input id="username" placeholder="用户名" maxlength="12">
  <input id="password" type="password" placeholder="密码">
  <select id="langSelect">
    <option value="zh">中文</option>
    <option value="vi">Tiếng Việt（越南语）</option>
  </select>
  <button id="btnLogin">登录</button>
  <button id="btnRegister" class="secondary">注册新账号</button>
</div>

<!-- 聊天页 -->
<div class="chat" id="chatBox">
  <div class="chat-inner">
    <!-- 左侧栏 -->
    <div class="sidebar">
      <div class="me">
        <div class="avatar" id="myAvatar">-</div>
        <div class="info">
          <div class="name" id="myName">-</div>
          <div class="status" id="myStatus">在线</div>
        </div>
        <button class="icon-btn" id="btnTheme" title="切换主题">🌙</button>
        <button class="icon-btn" id="logout" title="退出">⏻</button>
      </div>

      <div class="search-box">
        <input id="searchInput" placeholder="搜索用户...">
      </div>

      <div class="section">频道</div>
      <div class="list" id="publicList">
        <div class="item active" data-room="public">
          <div class="item-avatar" style="background: linear-gradient(135deg, #0088cc, #00a884)">💬</div>
          <div class="item-info">
            <div class="item-name">公共聊天室</div>
            <div class="item-status" id="publicStatus">0 人在线</div>
          </div>
        </div>
      </div>

      <div class="section">在线用户</div>
      <div class="list" id="userList"></div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="main">
      <div class="header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="header-avatar" id="headerAvatar">💬</div>
        <div class="header-info">
          <div class="header-name" id="chatTitle">公共聊天室</div>
          <div class="header-status" id="chatStatus">0 人在线</div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="emoji-panel" id="emojiPanel"></div>
      <div class="image-preview" id="imagePreview"></div>

      <div class="input-area">
        <button class="icon-btn" id="btnEmoji" title="表情">😊</button>
        <button class="icon-btn" id="btnImage" title="图片">📎</button>
        <div class="input-wrap">
          <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
        </div>
        <button class="send-btn" id="send" title="发送">➤</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let socket = null;
let myNick = '';
let currentRoom = 'public';
let pendingImage = null;
let msgMap = {};
let unreadMap = {};
let allOnlineUsers = [];

if (localStorage.getItem('chat_theme') === 'dark') {
  document.body.classList.add('dark');
  $('btnTheme').textContent = '☀️';
}

async function post(url, data) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  return res.json();
}

async function doLogin() {
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg('请填写用户名和密码'); return; }
  const r = await post('/api/login', { username, password });
  if (!r.ok) { showMsg(r.msg); return; }
  onLoginSuccess(r.token, r.username, r.lang);
}

async function doRegister() {
  const username = $('username').value.trim();
  const password = $('password').value;
  const lang = $('langSelect').value;
  if (!username || !password) { showMsg('请填写用户名和密码'); return; }
  const r = await post('/api/register', { username, password, lang });
  if (!r.ok) { showMsg(r.msg); return; }
  onLoginSuccess(r.token, r.username, r.lang);
}

function showMsg(text) { $('loginMsg').textContent = text; }

function onLoginSuccess(token, username, lang) {
  localStorage.setItem('chat_token', token);
  localStorage.setItem('chat_username', username);
  localStorage.setItem('chat_lang', lang || 'zh');
  myNick = username;
  $('loginBox').style.display = 'none';
  $('chatBox').style.display = 'block';
  $('myName').textContent = username;
  $('myAvatar').textContent = username.charAt(0).toUpperCase();
  connectSocket(token);
}

$('btnLogin').onclick = doLogin;
$('btnRegister').onclick = doRegister;
$('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

$('btnTheme').onclick = () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('chat_theme', isDark ? 'dark' : 'light');
  $('btnTheme').textContent = isDark ? '☀️' : '🌙';
};

$('logout').onclick = () => {
  if (!confirm('确定退出？')) return;
  localStorage.removeItem('chat_token');
  localStorage.removeItem('chat_username');
  localStorage.removeItem('chat_lang');
  if (socket) socket.disconnect();
  location.reload();
};

function connectSocket(token) {
  socket = io({ auth: { token } });

  socket.on('connect_error', (err) => {
    alert('连接失败：' + err.message);
    localStorage.removeItem('chat_token');
    location.reload();
  });

  socket.on('history', ({ room, list }) => {
    if (room !== 'public') return;
    $('messages').innerHTML = '';
    msgMap = {};
    list.forEach(m => renderMsg({ ...m, room: 'public' }, false));
    $('messages').scrollTop = $('messages').scrollHeight;
  });

  socket.on('message', (data) => {
    if (currentRoom === 'public') {
      renderMsg({ ...data, room: 'public' });
    }
    if (data.nickname !== myNick) notify(data.nickname, data.text || '[图片]');
  });

  socket.on('private', (data) => {
    if (currentRoom === data.from || currentRoom === data.to) {
      renderMsg({
        id: data.id,
        nickname: data.from,
        text: data.text,
        image: data.image,
        time: data.time,
        room: 'private',
        me: data.self,
      });
    } else {
      notify(data.from, data.text || '[图片]');
    }
  });

  socket.on('private_error', ({ msg }) => alert(msg));

  socket.on('private_history', ({ other, list }) => {
    $('messages').innerHTML = '';
    msgMap = {};
    list.forEach(m => {
      renderMsg({
        id: m.id,
        nickname: m.nickname,
        text: m.text,
        image: m.image,
        time: m.time,
        room: 'private',
        me: m.nickname === myNick,
      }, false);
    });
    $('messages').scrollTop = $('messages').scrollHeight;
  });

  socket.on('revoked', ({ id, room }) => {
    if (room === 'public' && currentRoom !== 'public') return;
    const el = msgMap[id];
    if (el) {
      const bubble = el.querySelector('.bubble');
      bubble.innerHTML = '<span class="revoked">消息已撤回</span>';
    }
  });

  socket.on('system', (text) => {
    if (currentRoom === 'public') {
      renderMsg({ type: 'system', text, room: 'public' });
    }
  });

  socket.on('userlist', (list) => {
    allOnlineUsers = list;
    $('publicStatus').textContent = list.length + ' 人在线';
    $('chatStatus').textContent = currentRoom === 'public' ? list.length + ' 人在线' : '在线';
    renderUserList(list);
  });

  socket.on('unread', (list) => {
    renderUnread(list);
  });
}

function renderUnread(list) {
  unreadMap = {};
  list.forEach(u => unreadMap[u.nickname] = u.cnt);
  renderUserList(allOnlineUsers);
}

function renderUserList(onlineList) {
  const box = $('userList');
  const keyword = ($('searchInput').value || '').toLowerCase();
  box.innerHTML = '';
  onlineList.forEach(name => {
    if (name === myNick) return;
    if (keyword && !name.toLowerCase().includes(keyword)) return;
    const div = document.createElement('div');
    div.className = 'item' + (currentRoom === name ? ' active' : '');
    div.innerHTML = `
      <div class="item-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>
      <div class="item-info">
        <div class="item-name">${escapeHtml(name)}</div>
        <div class="item-status"><span class="dot"></span>在线</div>
      </div>
      ${unreadMap[name] > 0 ? `<span class="badge">${unreadMap[name]}</span>` : ''}
    `;
    div.onclick = () => switchToPrivate(name);
    box.appendChild(div);
  });
}

$('searchInput').addEventListener('input', () => {
  renderUserList(allOnlineUsers);
});

function switchToPrivate(name) {
  currentRoom = name;
  $('chatTitle').textContent = name;
  $('headerAvatar').textContent = name.charAt(0).toUpperCase();
  $('chatStatus').textContent = '在线';
  $('messages').innerHTML = '';
  msgMap = {};
  socket.emit('private_history', name);
  document.querySelectorAll('#userList .item').forEach(el => {
    el.classList.toggle('active', el.querySelector('.item-name').textContent === name);
  });
  document.querySelectorAll('#publicList .item').forEach(el => el.classList.remove('active'));
  if (window.innerWidth <= 768) $('chatBox').classList.add('mobile-chat');
}

function switchToPublic() {
  currentRoom = 'public';
  $('chatTitle').textContent = '公共聊天室';
  $('headerAvatar').textContent = '💬';
  $('chatStatus').textContent = allOnlineUsers.length + ' 人在线';
  $('messages').innerHTML = '';
  msgMap = {};
  socket.emit('join', myNick);
  document.querySelectorAll('#userList .item').forEach(el => el.classList.remove('active'));
  document.querySelector('#publicList .item').classList.add('active');
  if (window.innerWidth <= 768) $('chatBox').classList.remove('mobile-chat');
}

document.querySelector('#publicList .item').onclick = switchToPublic;
$('backBtn').onclick = switchToPublic;

function renderMsg(data, scroll = true) {
  const isMe = data.me !== undefined ? data.me : (data.nickname === myNick);
  const div = document.createElement('div');
  if (data.type === 'system') {
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble">${escapeHtml(data.text)}</div>`;
  } else {
    let cls = 'msg';
    if (isMe) cls += ' me';
    if (data.room === 'private') cls += ' private';
    div.className = cls;

    let content = '';
    if (data.image) {
      content = `<img src="${data.image}" onclick="window.open(this.src)">`;
    } else {
      content = escapeHtml(data.text);
    }

    let revokeBtn = '';
    if (isMe && data.id) {
      revokeBtn = `<button class="revoke-btn" data-id="${data.id}">撤回</button>`;
    }

    const senderName = data.room === 'public' && !isMe
      ? `<span class="sender">${escapeHtml(data.nickname)}</span> · `
      : '';

    div.innerHTML = `
      <div class="bubble">${content}</div>
      <div class="time">
        ${senderName}${data.time}
        ${isMe ? '<span class="check">✓✓</span>' : ''}
        ${revokeBtn}
      </div>
    `;

    if (data.id) msgMap[data.id] = div;

    const btn = div.querySelector('.revoke-btn');
    if (btn) {
      btn.onclick = () => {
        if (!confirm('确定撤回这条消息？')) return;
        if (currentRoom === 'public') {
          socket.emit('revoke', { id: data.id, room: 'public' });
        } else {
          socket.emit('revoke', { id: data.id, to: currentRoom });
        }
      };
    }
  }
  $('messages').appendChild(div);
  if (scroll) $('messages').scrollTop = $('messages').scrollHeight;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function notify(from, text) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(from, { body: text });
  }
  if (document.hidden) {
    let count = 0;
    const timer = setInterval(() => {
      document.title = (count % 2 === 0) ? '💬 新消息' : '聊天室';
      count++;
      if (count > 6) { clearInterval(timer); document.title = '聊天室'; }
    }, 500);
  }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  } catch {}
}

if ('Notification' in window && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission(), 3000);
}

const EMOJIS = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','🥴','😠','😡','🤬','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐','🖖','👋','🤝','🙏','❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','❣️','💕','💞','💓','💗','💖','💘','💝','🔥','⭐','🌟','✨','💫','⚡','💥','💢','💦','💨'];

function buildEmojiPanel() {
  const panel = $('emojiPanel');
  panel.innerHTML = EMOJIS.map(e => `<span>${e}</span>`).join('');
  panel.querySelectorAll('span').forEach(s => {
    s.onclick = () => {
      $('input').value += s.textContent;
      $('input').focus();
    };
  });
}
buildEmojiPanel();

$('btnEmoji').onclick = (e) => {
  e.stopPropagation();
  $('emojiPanel').classList.toggle('show');
  $('imagePreview').classList.remove('show');
};

document.addEventListener('click', (e) => {
  if (!e.target.closest('#emojiPanel') && !e.target.closest('#btnEmoji')) {
    $('emojiPanel').classList.remove('show');
  }
});

$('btnImage').onclick = () => $('fileInput').click();

$('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingImage = ev.target.result;
    showImagePreview(pendingImage);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

function showImagePreview(src) {
  const box = $('imagePreview');
  box.innerHTML = `<img src="${src}"><button>取消</button>`;
  box.classList.add('show');
  box.querySelector('button').onclick = () => {
    pendingImage = null;
    box.classList.remove('show');
  };
  $('emojiPanel').classList.remove('show');
}

async function send() {
  const text = $('input').value.trim();
  if (!text && !pendingImage) return;
  if (!socket) return;

  let imageUrl = null;
  if (pendingImage) {
    const r = await post('/api/upload', { image: pendingImage });
    if (r.ok) imageUrl = r.url;
    pendingImage = null;
    $('imagePreview').classList.remove('show');
  }

  if (currentRoom === 'public') {
    socket.emit('message', { text, image: imageUrl });
  } else {
    socket.emit('private', { to: currentRoom, text, image: imageUrl });
  }
  $('input').value = '';
}
$('send').onclick = send;
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

const savedToken = localStorage.getItem('chat_token');
const savedName = localStorage.getItem('chat_username');
if (savedToken && savedName) {
  myNick = savedName;
  $('loginBox').style.display = 'none';
  $('chatBox').style.display = 'block';
  $('myName').textContent = savedName;
  $('myAvatar').textContent = savedName.charAt(0).toUpperCase();
  connectSocket(savedToken);
}
</script>
